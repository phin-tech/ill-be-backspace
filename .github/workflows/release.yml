name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Wheels are the primary distribution channel: they make `language: python`
  # pre-commit hooks work without a Rust toolchain on the consumer side.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native ARM runner rather than a cross toolchain; free on public repos.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/backspace.exe out/
            cd out && 7z a ../backspace-${{ matrix.target }}.zip backspace.exe
          else
            cp target/${{ matrix.target }}/release/backspace out/
            tar czf backspace-${{ matrix.target }}.tar.gz -C out backspace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: backspace-${{ matrix.target }}.*

  publish:
    needs: [wheels, sdist, binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist release
          find artifacts -name '*.whl' -o -name '*.tar.gz' -path '*wheels*' | xargs -I{} cp {} dist/ || true
          find artifacts -name 'backspace-*.tar.gz' -o -name 'backspace-*.zip' | xargs -I{} cp {} release/ || true
          ls -la dist release

      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  homebrew:
    name: bump homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Skips cleanly when the secret is absent, so the job is safe to merge
      # before the token exists.
      - name: Guard on tap token
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret set — skipping tap bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: phin-tech/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          REPO="${{ github.repository }}"
          base="https://github.com/${REPO}/releases/download/${TAG}"

          # Checksums come from the published assets themselves, so the formula
          # can never disagree with what a user actually downloads.
          gh release download "$TAG" -R "$REPO" -p '*.tar.gz' -D assets
          sha() { sha256sum "assets/backspace-$1.tar.gz" | awk '{print $1}'; }
          MAC_ARM=$(sha aarch64-apple-darwin)
          MAC_X86=$(sha x86_64-apple-darwin)
          LIN_ARM=$(sha aarch64-unknown-linux-gnu)
          LIN_X86=$(sha x86_64-unknown-linux-gnu)

          mkdir -p tap/Formula
          cat > tap/Formula/backspace.rb <<EOF
          # Auto-generated by ill-be-backspace's release workflow. Do not edit by hand.
          class Backspace < Formula
            desc "Flags comment blocks that have outgrown the code they describe"
            homepage "https://github.com/${REPO}"
            version "${VER}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/backspace-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM}"
              end
              on_intel do
                url "${base}/backspace-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/backspace-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "${base}/backspace-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LIN_X86}"
              end
            end

            def install
              bin.install "backspace"
            end

            test do
              assert_match "backspace", shell_output("#{bin}/backspace --version")
              (testpath/"a.py").write("# a\n# b\n# c\n# d\n# e\n# f\nx = 1\n")
              assert_match "block-too-long", shell_output("#{bin}/backspace a.py --all", 1)
            end
          end
          EOF

      - name: Commit to tap
        if: steps.guard.outputs.skip != 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/backspace.rb
          git commit -m "backspace ${GITHUB_REF_NAME}" || { echo "no changes"; exit 0; }
          git push
