[package]
name = "ill-be-backspace"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
description = "A linter that flags over-long, over-explaining comment blocks across many languages."
license = "MIT"
repository = "https://github.com/phin-tech/ill-be-backspace"
homepage = "https://github.com/phin-tech/ill-be-backspace"
readme = "README.md"
keywords = ["linter", "comments", "pre-commit", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["/tests/fixtures", "/.github"]
# Distributed via PyPI wheels, Homebrew and GitHub Releases, not crates.io.
publish = false

[lib]
name = "backspace"
path = "src/lib.rs"

[[bin]]
name = "backspace"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
globset = "0.4.19"
ignore = "0.4.30"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.0.7"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
